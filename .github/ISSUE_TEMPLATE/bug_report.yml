name: Bug report
description: Report unexpected extension behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
